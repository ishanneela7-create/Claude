<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Brick Library</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='12' width='26' height='16' rx='3' fill='%23145abe'/%3E%3Ccircle cx='10' cy='9' r='4' fill='%230e8250'/%3E%3Ccircle cx='22' cy='9' r='4' fill='%230e8250'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var saved = localStorage.getItem('brick-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
